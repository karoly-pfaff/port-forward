version: 2

updates:
  # Root npm workspaces (shared, server, client) plus root tooling.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # @types/node tracks the supported Node floor (Node 24, matching the esbuild
      # --target in scripts/*/build-runtime.*), so majors are raised by hand.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      npm-dev:
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-prod:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /service
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /tools/cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /tools/replay
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types:
          - minor
          - patch
