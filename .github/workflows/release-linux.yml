# Portier Linux release.
#
# Builds and validates the Linux release artifacts on a native ubuntu-latest runner and
# uploads them as a workflow artifact for inspection. Does NOT publish a GitHub Release
# and does NOT create tags. Manual trigger only (workflow_dispatch).
#
# Artifacts (packages first, portables second, checksums last):
#   1. portier_<version>_amd64.deb            (file-install dpkg-deb package, disabled unit)
#   2. portier-<version>-1.x86_64.rpm         (file-install rpmbuild package, disabled unit)
#   3. portier-<version>-linux-amd64.tar.gz   (portable, x86-64)
#   4. portier-<version>-linux-arm64.tar.gz   (portable, ARM64)
#   5. checksums.sha256
# build:release:current cross-builds both Linux arches; only the host arch is runtime-smoked.
#
# Privacy: only build/releases/linux/** is uploaded. docs/private/** is never staged
# into release output; validate-artifacts.js logs the upload set and hard-fails on any
# `private` path segment before upload.

name: Release Linux

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  GO_VERSION: "1.25"

jobs:
  linux-release:
    name: Linux release (deb + portable)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          # The Go module with external deps lives in service/; point the cache there
          # (the tools/cli and tools/replay modules have no go.sum). Avoids the
          # "Dependencies file is not found ... go.sum" cache warning.
          cache-dependency-path: service/go.sum

      # rpm tooling (rpmbuild + the rpm CLI) so the .rpm is built and introspected/installed.
      # The rpm db is independent of dpkg, so `rpm -i`/`rpm -e` are safe on this runner.
      - name: Install rpm tooling
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Builds the native .deb (dpkg-deb) + .rpm (rpmbuild) + the Linux portable tar.gz
      # artifacts + checksums.sha256.
      - name: Build current-platform release (.deb + .rpm + portable tar.gz)
        run: npm run build:release:current

      - name: Validate current-platform release
        run: npm run validate:release:current

      - name: Validate checksums (checksums.sha256)
        run: npm run validate:release:checksums

      # Structural validation of BOTH Linux portable arches (amd64 + arm64), incl. a binary
      # machine-type check. Foreign-arch binaries are not executed — only the host arch is
      # runtime-smoked below.
      - name: Validate portable artifacts (amd64 + arm64, structural)
        run: npm run validate:release:portable:linux

      - name: Runtime smoke (packaged runtime)
        run: npm run validate:runtime:smoke

      - name: Upgrade-preservation smoke
        run: npm run validate:upgrade:current

      # .deb payload introspection: confirm the package carries the runtime binaries,
      # the OpenAPI artifact, and the (disabled) systemd unit. The package is a
      # file-install: it does not enable/start the service (see build-release.sh).
      - name: Inspect .deb payload
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          DEB="build/releases/linux/portier_${VERSION}_amd64.deb"
          echo "Inspecting ${DEB}"
          dpkg-deb --info "${DEB}"
          dpkg-deb --contents "${DEB}" | awk '{print $NF}' | sort > deb-paths.txt
          cat deb-paths.txt
          for f in ./opt/portier/portier ./opt/portier/service ./opt/portier/server.js \
                   ./opt/portier/api/openapi.json ./opt/portier/web/index.html \
                   ./lib/systemd/system/portier.service; do
            if grep -qxF "$f" deb-paths.txt; then
              echo "  ok: ${f}"
            else
              echo "  MISSING from .deb payload: ${f}" >&2
              exit 1
            fi
          done
          # The package must NOT ship user config.
          if grep -qE 'rules\.json$' deb-paths.txt; then
            echo "  ERROR: .deb must not contain rules.json" >&2
            exit 1
          fi

      # Native install/remove smoke: installs the .deb with apt-get (passwordless sudo on
      # hosted runners), asserts the installed layout + version, that the systemd unit is
      # DISABLED + inactive (package never enables/starts it) and a seeded
      # /etc/portier/rules.json is untouched, then removes the package and asserts clean
      # removal with user config preserved. This is a package-lifecycle smoke; full
      # systemd service install validation (npm run validate:service:linux) stays a
      # separate manual/native check. See docs/checklist.md.
      - name: Install/remove smoke (.deb)
        run: npm run validate:install:deb

      # .rpm payload introspection (rpm -qlp): same layout assertions as the .deb, plus
      # forbidden-content (no rules.json, no docs/private).
      - name: Inspect .rpm payload
        run: npm run validate:install:rpm:payload

      # Native .rpm install/remove smoke: `rpm -i` then `rpm -e` (the rpm db is independent
      # of dpkg). Asserts the installed layout + version, that the systemd unit is DISABLED +
      # inactive (package never enables/starts it) and a seeded /etc/portier/rules.json is
      # untouched, then removes and asserts clean removal with user config preserved.
      - name: Install/remove smoke (.rpm)
        run: npm run validate:install:rpm

      - name: List release artifacts + privacy guard
        run: npm run validate:artifacts

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: portier-release-linux
          path: build/releases/linux/**
          if-no-files-found: error
