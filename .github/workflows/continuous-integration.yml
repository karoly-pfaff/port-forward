name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  GO_VERSION: "1.25"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Script checks
        run: npm run validate:scripts

  shared:
    name: Shared
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build:shared
      - name: Typecheck
        run: npm run typecheck -w shared
      - name: Coverage
        run: npm run validate:coverage:shared

  server:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build:shared && npm run build:server
      - name: Typecheck
        run: npm run typecheck -w server
      - name: Coverage
        run: npm run validate:coverage:server

  service:
    name: Service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: service/go.sum
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build:shared && npm run build:service
      - name: Generate OpenAPI
        run: npm run apidoc:generate
      - name: Coverage
        run: npm run validate:coverage:service
      - name: API parity
        run: npm run validate:openapi:go

  client:
    name: Client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build:shared && npm run build:server && npm run build:client
      - name: Typecheck
        run: npm run typecheck -w client
      - name: Coverage
        run: npm run validate:coverage:client
      - name: Install browsers
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e

  cli:
    name: CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: service/go.sum
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build:cli
      - name: Coverage
        run: npm run validate:coverage:cli

  replay:
    name: Replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: service/go.sum
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build:replay
      - name: Coverage
        run: npm run validate:coverage:replay
