# Portier Windows release.
#
# Builds and validates the Windows release artifacts on a native windows-latest runner
# and uploads them as a workflow artifact for inspection. Does NOT publish a GitHub
# Release and does NOT create tags. Manual trigger only (workflow_dispatch).
#
# Artifacts (package first, portable second, checksums last):
#   1. Portier-<version>.msi                  (canonical WiX installer)
#   2. portier-<version>-windows-amd64.zip    (portable)
#   3. checksums.sha256
# Windows is amd64-only (no arm64 portable in this slice).
#
# Privacy: only build/releases/windows/** is uploaded. docs/private/** is never staged
# into release output; validate-artifacts.js logs the upload set and hard-fails on any
# `private` path segment before upload.

name: Release Windows

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  GO_VERSION: "1.25"

jobs:
  windows-release:
    name: Windows release (MSI + portable)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          # The Go module with external deps lives in service/; point the cache there
          # (the tools/cli and tools/replay modules have no go.sum). Avoids the
          # "Dependencies file is not found ... go.sum" cache warning.
          cache-dependency-path: service/go.sum

      - name: Setup .NET (for WiX 7 dotnet tool)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Install WiX 7 (dotnet global tool)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 7.*
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify WiX
        shell: pwsh
        run: wix --version

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Builds the canonical MSI + the Windows portable zip + checksums.sha256.
      - name: Build current-platform release (.msi + portable zip)
        run: npm run build:release:current

      - name: Validate current-platform release
        run: npm run validate:release:current

      - name: Validate checksums (checksums.sha256)
        run: npm run validate:release:checksums

      # Structural validation of the Windows portable zip (amd64-only), incl. a binary
      # machine-type check.
      - name: Validate portable artifact (amd64, structural)
        run: npm run validate:release:portable:windows

      - name: Runtime smoke (packaged runtime)
        run: npm run validate:runtime:smoke

      - name: Upgrade-preservation smoke
        run: npm run validate:upgrade:current

      # Non-elevated MSI extraction smoke: `msiexec /a` lays out the exact payload without
      # admin and validates the installed layout, version, and config boundary.
      - name: MSI install smoke (extraction, msiexec /a)
        run: npm run validate:msi:install

      # Full elevated MSI install/uninstall smoke: per-machine `msiexec /i` then `/x`. Asserts
      # the installed layout + version, that NO Windows service / scheduled task is created and
      # %ProgramData%\Portier\rules.json is preserved, and that uninstall removes the install
      # dir while keeping user config. Hosted windows-latest runs elevated; on a non-elevated
      # shell the script skips honestly (exit 0). No service custom actions are wired.
      - name: MSI install smoke (full, msiexec /i + /x, elevated)
        run: npm run validate:msi:install:full

      - name: List release artifacts + privacy guard
        run: npm run validate:artifacts

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: portier-release-windows
          path: build/releases/windows/**
          if-no-files-found: error
